<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="Temperatureconverter.css">
</head>

<body>

    <div class="converter-container">

        <h1>Temperature Converter</h1>

        <p class="description">
            Convert temperature between Celsius, Fahrenheit and Kelvin.
        </p>

        <div class="input-section">

            <label for="temperature">Enter Temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
                step="any"
            >

            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button type="button" id="convertBtn">
                Convert
            </button>

            <p id="errorMessage"></p>

        </div>

        <div class="result-section">

            <h2>Results</h2>

            <div class="result-box">
                <span>Celsius</span>
                <span id="celsiusResult">-- °C</span>
            </div>

            <div class="result-box">
                <span>Fahrenheit</span>
                <span id="fahrenheitResult">-- °F</span>
            </div>

            <div class="result-box">
                <span>Kelvin</span>
                <span id="kelvinResult">-- K</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
